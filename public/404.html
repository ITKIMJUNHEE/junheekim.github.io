<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>junheekim.cloud</title>
    <script>
      // GitHub Pages는 정적 호스팅이라 /projects/oasis-tram 같은 경로를 직접 요청하면 404를 준다.
      // 이 페이지가 404를 가로채서 경로를 쿼리스트링에 인코딩한 뒤 index.html로 보내고,
      // index.html의 스크립트가 이를 다시 실제 경로로 복원한다. (rafgraph/spa-github-pages 패턴)
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
